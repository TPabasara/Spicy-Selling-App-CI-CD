environment: staging

replicaCount:
  backend: 2
  frontend: 1

image:
  backend:
    tag: "staging"
    pullPolicy: Always
  frontend:
    tag: "staging"
    pullPolicy: Always

config:
  DEBUG: "true"
  LOG_LEVEL: "debug"

# Staging uses lighter replicas than production, but still enables autoscaling and monitoring.
autoscaling:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  frontend:
    enabled: true
    minReplicas: 1
    maxReplicas: 4

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
