environment: production

replicaCount:
  backend: 5
  frontend: 3

image:
  backend:
    repository: ghcr.io/spice-shop/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/spice-shop/frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent

resources:
  backend:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  frontend:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

autoscaling:
  backend:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70

pdb:
  backend:
    enabled: true
    minAvailable: 3
  frontend:
    enabled: true
    minAvailable: 2

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
