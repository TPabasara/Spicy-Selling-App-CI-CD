name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  # CHANGED: Removed GHCR registry and updated image paths to use your DockerHub username secret
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/spice-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/spice-frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Detect Changes =====
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker/backend.Dockerfile'
            frontend:
              - 'frontend/**'
              - 'docker/frontend.Dockerfile'
            infrastructure:
              - 'terraform/**'
              - 'k8s/**'
              - 'helm/**'
              - '.github/workflows/**'

  # ===== Code Quality =====
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        if: matrix.service == 'backend' && needs.detect-changes.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Lint Backend
        if: matrix.service == 'backend' && needs.detect-changes.outputs.backend == 'true'
        run: |
          cd backend
          pip install flake8 black isort mypy
          echo "=== Running Flake8 ==="
          flake8 app/ --count --max-complexity=10 --max-line-length=120 --statistics
          echo "=== Running Black ==="
          black --check --diff app/
          echo "=== Running isort ==="
          isort --check-only --diff app/
          echo "=== Running mypy ==="
          mypy app/ --ignore-missing-imports || true

      - name: Setup Node.js
        if: matrix.service == 'frontend' && needs.detect-changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Lint Frontend
        if: matrix.service == 'frontend' && needs.detect-changes.outputs.frontend == 'true'
        run: |
          cd frontend
          npm ci
          npm run lint || true
          npx prettier --check "app/**/*.{ts,tsx}" || true

  # ===== Security Scanning =====
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v3
        if: github.event_name == 'pull_request'

      - name: Check for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .github/gitleaks.toml

  # ===== Unit Tests =====
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: spice_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Backend Tests
        if: matrix.service == 'backend'
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/spice_test
          SECRET_KEY: test-secret-key-for-ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          DEBUG: "false"
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
          alembic upgrade head
          python -m app.core.init_db
          pytest --cov=app --cov-report=xml --cov-report=html -v

      - name: Frontend Tests
        if: matrix.service == 'frontend'
        run: |
          cd frontend
          npm ci
          npm test -- --coverage --watchAll=false || echo "No tests configured yet"

      - name: Upload Backend Coverage
        if: matrix.service == 'backend'
        uses: codecov/codecov-action@v3
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Upload Frontend Coverage
        if: matrix.service == 'frontend'
        uses: codecov/codecov-action@v3
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  # ===== Build & Push Docker Images =====
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      github.event_name == 'push'
    outputs:
      backend_tag: ${{ steps.meta_backend.outputs.tags }}
      frontend_tag: ${{ steps.meta_frontend.outputs.tags }}
      backend_digest: ${{ steps.build_backend.outputs.digest }}
      frontend_digest: ${{ steps.build_frontend.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      # CHANGED: Now logs into DockerHub using the secrets you created
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # CHANGED: Removed the registry prefix from the images target
      - name: Extract Backend Metadata
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=backend-,format=short
            type=ref,event=branch,prefix=backend-
            type=raw,value=backend-latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push Backend
        id: build_backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # CHANGED: Removed the registry prefix from the images target
      - name: Extract Frontend Metadata
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=frontend-,format=short
            type=ref,event=branch,prefix=frontend-
            type=raw,value=frontend-latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push Frontend
        id: build_frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # CHANGED: Removed the registry prefix for Cosign image targets
      - name: Sign Images with Cosign
        uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'
      - run: |
          cosign sign --yes ${{ env.BACKEND_IMAGE }}@${{ steps.build_backend.outputs.digest }}
          cosign sign --yes ${{ env.FRONTEND_IMAGE }}@${{ steps.build_frontend.outputs.digest }}
        if: github.ref == 'refs/heads/main'

  # ===== Generate SBOM =====
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # CHANGED: Removed the registry prefix from the image target
      - name: Generate SBOM for Backend
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:backend-latest
          format: spdx-json
          output-file: backend-sbom.spdx.json

      # CHANGED: Removed the registry prefix from the image target
      - name: Generate SBOM for Frontend
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:frontend-latest
          format: spdx-json
          output-file: frontend-sbom.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: "*.spdx.json"

  # ===== Terraform Plan (Infrastructure Changes) =====
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -out=tfplan -var-file="terraform.tfvars"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

  # ===== Notify =====
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: always()
    steps:
      - name: Notify Slack on Failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ CI Pipeline FAILED!\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nURL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify Slack on Success
        if: success() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ CI Pipeline PASSED!\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
