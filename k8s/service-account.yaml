apiVersion: v1
kind: ServiceAccount
metadata:
  name: spice-shop-sa
  namespace: spice-shop
  labels:
    app: spice-shop
    component: service-account
  annotations:
    note: "Least-privilege service account for SpiceShop workloads."
# Do not auto-mount the service account token by default; enable only for pods that require it.
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spice-shop-role
  namespace: spice-shop
  labels:
    app: spice-shop
    component: role
rules:
  # Allow reading ConfigMaps (application config) - required by pods that load config from k8s
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Allow basic read access to Deployments for monitoring or controllers running in-namespace
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

  # Allow reading pods for basic liveness/monitoring checks (read-only)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spice-shop-rb
  namespace: spice-shop
  labels:
    app: spice-shop
    component: rolebinding
subjects:
  - kind: ServiceAccount
    name: spice-shop-sa
    namespace: spice-shop
roleRef:
  kind: Role
  name: spice-shop-role
  apiGroup: rbac.authorization.k8s.io
